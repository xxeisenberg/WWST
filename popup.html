<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WWST</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-bar">
        <img
          class="app-bar__icon"
          src="icon.png"
          alt=""
          width="34"
          height="34"
        />
        <div class="app-bar__text">
          <h1 class="app-bar__title">WWST</h1>
          <p class="app-bar__subtitle">
            <span id="shortcut-label">Toggle sidebar with</span>
            <button
              class="shortcut"
              id="shortcut-button"
              type="button"
              title="Click to change shortcut"
              aria-label="Change shortcut"
            >
              <span class="shortcut__keys" id="shortcut-keys"></span>
              <span class="shortcut__edit" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="11" height="11">
                  <path
                    d="M10.9 2.2a1.5 1.5 0 0 1 2.1 2.1l-7.2 7.2-2.9.8.8-2.9 7.2-7.2Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </button>
          </p>
        </div>
      </header>

      <section class="chat">
        <div class="bubble">
          <label
            class="setting"
            for="ignore-hotkey-while-typing"
            title="When on, your shortcut won't toggle the sidebar while you type."
          >
            <span class="setting__label">
              <span class="setting__title">Ignore while typing</span>
              <span class="info" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="14" height="14">
                  <circle
                    cx="8"
                    cy="8"
                    r="6.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                  <path
                    d="M8 7.1v3.7"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                  <circle cx="8" cy="4.9" r="0.9" fill="currentColor" />
                </svg>
              </span>
            </span>
            <span class="switch">
              <input
                id="ignore-hotkey-while-typing"
                type="checkbox"
                role="switch"
                aria-describedby="ignore-hotkey-description"
              />
              <span class="switch__track" aria-hidden="true"></span>
            </span>
          </label>
        </div>

        <span id="ignore-hotkey-description" class="visually-hidden">
          When on, your shortcut won't toggle the sidebar while you type.
        </span>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>

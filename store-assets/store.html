<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WWST store images v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #f3eee4;
    --paper2: #ebe4d6;
    --ink: #10251d;
    --ink2: #4c5c55;
    --green: #128c64;
    --mint: #bfe8d2;
    --hair: rgba(16, 37, 29, .12);
    /* mock (light WhatsApp-like palette) */
    --m-head: #f0f2f5;
    --m-side: #ffffff;
    --m-chat: #efeae2;
    --m-in: #ffffff;
    --m-out: #d9fdd3;
    --m-text: #111b21;
    --m-muted: #667781;
    --m-line: #e9edef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: "Geist", system-ui, sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }

  .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--paper); isolation: isolate; }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); z-index: -2; }
  .grain { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .32; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .24  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; letter-spacing: -.01em; }
  .display { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 78px; line-height: .98; letter-spacing: -.02em; }
  .display em { font-style: italic; color: var(--green); }
  .lede { font-size: 20px; line-height: 1.5; color: var(--ink2); }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 17px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 4px 12px rgba(16,37,29,.18); }

  /* keycaps */
  .keys { display: inline-flex; align-items: center; gap: 10px; }
  .k { height: 52px; min-width: 52px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center;
    font: 500 20px "Geist", sans-serif; color: var(--ink); background: #fbf8f2; border-radius: 12px;
    box-shadow: inset 0 -3px 0 rgba(16,37,29,.10), 0 0 0 1px rgba(16,37,29,.12), 0 8px 20px rgba(16,37,29,.08); }
  .k.go { background: var(--ink); color: #f3eee4; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), 0 8px 22px rgba(16,37,29,.25); }
  .keys .p { color: var(--ink2); font-size: 18px; }

  /* browser mock */
  .win { position: absolute; border-radius: 16px; overflow: hidden; background: #fff; display: flex; flex-direction: column;
    box-shadow: 0 0 0 1px rgba(16,37,29,.08), 0 2px 4px rgba(16,37,29,.04), 0 30px 60px -10px rgba(16,37,29,.22), 0 60px 120px -30px rgba(16,37,29,.25); }
  .bar { height: 42px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #f7f5f0; border-bottom: 1px solid #ebe7de; }
  .dots { display: flex; gap: 7px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: #dcd6ca; display: block; }
  .url { flex: 1; max-width: 360px; margin: 0 auto; height: 26px; border-radius: 8px; background: #ece8df; font-size: 13px; color: #7a817c; display: flex; align-items: center; justify-content: center; }
  .ext { width: 22px; height: 22px; border-radius: 6px; background: url(../icons/icon-128.png) center/cover; }
  .app { flex: 1; display: flex; min-height: 0; position: relative; }
  .rail { width: 58px; flex: none; background: var(--m-head); border-right: 1px solid var(--m-line); display: flex; flex-direction: column; align-items: center; padding-top: 14px; gap: 10px; }
  .ri { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #54656f; }
  .ri.on { background: #d9dbdf; color: #111b21; }
  .ri svg { width: 22px; height: 22px; }
  .side { width: 300px; flex: none; background: var(--m-side); border-right: 1px solid var(--m-line); display: flex; flex-direction: column; }
  .side h4 { font: 700 21px "Geist", sans-serif; color: #111b21; padding: 16px 18px 10px; }
  .srch { margin: 0 14px 8px; height: 36px; border-radius: 18px; background: #f0f2f5; font-size: 14px; color: #8696a0; display: flex; align-items: center; padding: 0 16px; }
  .chips { display: flex; gap: 8px; padding: 2px 14px 8px; }
  .chip { font-size: 13px; padding: 5px 12px; border-radius: 14px; background: #f0f2f5; color: #54656f; }
  .chip.on { background: #d9fdd3; color: #0a5c3c; }
  .row { display: flex; gap: 12px; align-items: center; padding: 9px 14px; }
  .row.sel { background: #f0f2f5; }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font: 600 16px "Geist"; color: #fff; }
  .rt { flex: 1; min-width: 0; border-bottom: 1px solid var(--m-line); padding-bottom: 10px; margin-bottom: -10px; }
  .rt .n { display: flex; justify-content: space-between; font-size: 15px; color: #111b21; font-weight: 500; }
  .rt .n small { font-size: 12px; color: #667781; font-weight: 400; }
  .rt .m { font-size: 13.5px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--m-chat); position: relative; }
  .chat::before { content: ""; position: absolute; inset: 0; opacity: .55;
    background-image: radial-gradient(rgba(84,101,111,.10) 1.2px, transparent 1.3px); background-size: 18px 18px; }
  .ch { height: 58px; flex: none; background: var(--m-head); display: flex; align-items: center; gap: 12px; padding: 0 18px; position: relative; border-left: 1px solid var(--m-line); }
  .ch .av { width: 38px; height: 38px; font-size: 14px; }
  .ch b { font-size: 15px; font-weight: 500; color: #111b21; display: block; } .ch span { font-size: 12.5px; color: #667781; }
  .msgs { flex: 1; padding: 18px 7%; display: flex; flex-direction: column; gap: 6px; justify-content: flex-end; position: relative; }
  .day { align-self: center; font-size: 12px; color: #54656f; background: #fff; padding: 4px 10px; border-radius: 7px; margin: 6px 0; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .b { max-width: 70%; align-self: flex-start; background: var(--m-in); color: #111b21; font-size: 14.5px; line-height: 1.38; padding: 6px 9px 7px; border-radius: 8px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .b.o { align-self: flex-end; background: var(--m-out); }
  .b small { float: right; font-size: 11px; color: #667781; margin: 7px 0 -4px 10px; }
  .b .who { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 1px; }
  .cmp { height: 58px; flex: none; background: var(--m-head); display: flex; align-items: center; gap: 14px; padding: 0 16px; position: relative; }
  .cmp .f { flex: 1; height: 40px; border-radius: 10px; background: #fff; font-size: 14.5px; color: #8696a0; display: flex; align-items: center; padding: 0 14px; }
  .cmp svg { width: 22px; height: 22px; color: #54656f; }
  .off .side { display: none; }

  /* sliding ghost of the sidebar */
  .ghost { position: absolute; top: 0; bottom: 0; left: 58px; width: 300px; z-index: 3; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,.0), rgba(255,255,255,.7) 55%, rgba(255,255,255,.0));
    transform: translateX(-62%); filter: blur(2px); }
  .ghost::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: linear-gradient(transparent, rgba(18,140,100,.55), transparent); }

  .tagline { position: absolute; font-family: "Instrument Serif", serif; font-style: italic; font-size: 26px; color: var(--ink2); }
  .rule { position: absolute; height: 1px; background: var(--hair); }
  .shot { position: absolute; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px rgba(16,37,29,.06), 0 30px 60px -12px rgba(16,37,29,.28); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICON = "../icons/icon-128.png";
const SHOTS = "../screenshots/";

const I = {
  chats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z" stroke-linejoin="round"/><path d="M8 9h8M8 12.5h5" stroke-linecap="round"/></svg>',
  status: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8" stroke-dasharray="4 2.2"/><circle cx="12" cy="12" r="3.6"/></svg>',
  chan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 1 3 6.2L4 20l1-3.2A8 8 0 0 1 4 12z" stroke-linejoin="round"/></svg>',
  comm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.4"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M14.5 15.2c2.6-.6 4.9.7 5.8 3.8" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" stroke-linecap="round"/></svg>',
};

const PEOPLE = [
  ["Book Club", "#c98b5e", "Lena: ok chapter 9 was unhinged", "10:42"],
  ["Sam Ortiz", "#6f8fbf", "Sending the draft over now", "10:31"],
  ["Mum", "#8aa977", "Did you eat?", "09:58"],
  ["Trip to Lisbon", "#b07aa6", "Noor: flights booked ✈️", "09:12"],
  ["Design crit", "#c7a65a", "Theo: love the new colours", "Yesterday"],
  ["Priya", "#5fa59c", "haha yes, see you then", "Yesterday"],
  ["Climbing crew", "#8f7ac0", "Thursday 7pm?", "Mon"],
];
const initials = (n) => n.split(" ").map(w => w[0]).join("").slice(0, 2);

function side(sel) {
  return `<div class="side"><h4>Chats</h4><div class="srch">Search or start a new chat</div>
    <div class="chips"><span class="chip on">All</span><span class="chip">Unread</span><span class="chip">Groups</span></div>
    ${PEOPLE.map(([n, c, m, t], i) => `<div class="row ${i === sel ? "sel" : ""}"><div class="av" style="background:${c}">${initials(n)}</div>
      <div class="rt"><div class="n">${n}<small>${t}</small></div><div class="m">${m}</div></div></div>`).join("")}</div>`;
}
const THREAD = `
  <div class="day">Today</div>
  <div class="b"><span class="who" style="color:#b0602f">Lena</span>Has everyone finished it? No spoilers in here pls<small>10:21</small></div>
  <div class="b o">Finished last night. I have thoughts.<small>10:24</small></div>
  <div class="b"><span class="who" style="color:#3c7fb5">Noor</span>Same. That ending though 😭<small>10:26</small></div>
  <div class="b o">Let's save it for Sunday. My place, 4pm? I'll bake something.<small>10:30</small></div>
  <div class="b"><span class="who" style="color:#b0602f">Lena</span>ok chapter 9 was unhinged<small>10:42</small></div>`;

function win({ x, y, w, h, off = false, sel = 0, ghost = false, railOn = true, scale = 1 }) {
  return `<div class="win ${off ? "off" : ""}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${scale !== 1 ? `transform:scale(${scale});transform-origin:top left;` : ""}">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url">web.whatsapp.com</div><div class="ext"></div></div>
    <div class="app">
      <div class="rail"><div class="ri ${railOn ? "on" : ""}">${I.chats}</div><div class="ri">${I.status}</div><div class="ri">${I.chan}</div><div class="ri">${I.comm}</div></div>
      ${side(sel)}
      ${ghost ? '<div class="ghost"></div>' : ""}
      <div class="chat">
        <div class="ch"><div class="av" style="background:${PEOPLE[sel][1]}">${initials(PEOPLE[sel][0])}</div><div><b>${PEOPLE[sel][0]}</b><span>Lena, Noor, Sam, You</span></div></div>
        <div class="msgs">${THREAD}</div>
        <div class="cmp">${I.plus}<div class="f">Type a message</div>${I.mic}</div>
      </div>
    </div></div>`;
}
const keys = (a) => `<div class="keys">${a.map((k, i) => `${i ? '<span class="p">+</span>' : ""}<span class="k ${i === a.length - 1 ? "go" : ""}">${k}</span>`).join("")}</div>`;
const glows = (list) => list.map(([x, y, s, c]) => `<div class="glow" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${c}"></div>`).join("");
const MINT = "rgba(150, 214, 182, .55)", SAGE = "rgba(196, 220, 170, .45)", PEACH = "rgba(240, 196, 160, .35)";
const brand = `<div class="brand"><img src="${ICON}">WWST</div>`;
const CURSOR = `<svg viewBox="0 0 24 24" width="34" height="34" style="position:absolute;z-index:6;filter:drop-shadow(0 6px 8px rgba(16,37,29,.3))"><path d="M5 2.5l14 10-6.3 1.2 3.9 7-2.8 1.5-3.9-7.1L5 19.5z" fill="#10251d" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

const scenes = {
  hero: () => `<div class="stage">
    ${glows([[820, 380, 700, MINT], [-200, -260, 620, SAGE], [380, 560, 420, PEACH]])}
    <div style="position:absolute;left:76px;top:84px;width:440px;display:flex;flex-direction:column;gap:28px">
      ${brand}
      <div class="display">Give your chats <em>room to breathe.</em></div>
      <div class="lede">One shortcut folds away the WhatsApp&nbsp;Web sidebar. Press it again and it’s back.</div>
      ${keys(["Ctrl", "B"])}
    </div>
    ${win({ x: 568, y: 120, w: 660, h: 560, off: true })}
    <div class="grain"></div>
  </div>`,

  compare: () => `<div class="stage">
    ${glows([[380, 300, 640, MINT], [-260, 420, 520, SAGE], [1000, -200, 480, PEACH]])}
    <div style="position:absolute;left:0;right:0;top:56px;text-align:center">
      <div class="display" style="font-size:64px">Same chat. <em>More space.</em></div>
    </div>
    ${win({ x: 46, y: 196, w: 900, h: 640, scale: 0.62 })}
    ${win({ x: 674, y: 196, w: 900, h: 640, off: true, scale: 0.62 })}
    <div class="rule" style="left:46px;width:558px;top:620px"></div>
    <div class="rule" style="left:674px;width:558px;top:620px"></div>
    <div class="tagline" style="left:46px;top:636px">Sidebar on</div>
    <div class="label" style="left:46px;top:676px;position:absolute">Default</div>
    <div class="tagline" style="left:674px;top:636px;color:var(--green)">Sidebar off</div>
    <div class="label" style="left:674px;top:676px;position:absolute">Ctrl + B</div>
    <div class="grain"></div>
  </div>`,

  keys: () => `<div class="stage">
    ${glows([[300, 160, 680, MINT], [900, 420, 520, SAGE], [-160, 520, 420, PEACH]])}
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;text-align:center">
      <div class="label">The whole extension, in two keys</div>
      <div style="transform:scale(2.6);margin:46px 0">${keys(["Ctrl", "B"])}</div>
      <div class="display" style="font-size:60px">…or <em>any combo</em> you like.</div>
      <div class="lede" style="max-width:640px">Cmd&nbsp;+&nbsp;B on Mac. Remap it from the toolbar popup. Works on non-Latin keyboard layouts too.</div>
    </div>
    <div class="grain"></div>
  </div>`,

  click: () => `<div class="stage">
    ${glows([[-200, 200, 700, MINT], [900, -200, 520, SAGE], [700, 560, 420, PEACH]])}
    ${win({ x: 40, y: 70, w: 1100, h: 820, scale: 0.86 })}
    <div style="position:absolute;left:36px;top:105px;width:58px;height:58px;border-radius:50%;border:2px solid var(--green);box-shadow:0 0 0 10px rgba(18,140,100,.14);z-index:5"></div>
    <div style="position:absolute;left:70px;top:138px">${CURSOR}</div>
    <div style="position:absolute;right:0;top:0;bottom:0;width:470px;background:linear-gradient(90deg,rgba(243,238,228,0),var(--paper) 22%);"></div>
    <div style="position:absolute;left:860px;top:220px;width:360px;display:flex;flex-direction:column;gap:24px">
      <div class="label">Prefer the mouse?</div>
      <div class="display" style="font-size:64px">Click <em>Chats</em> to tuck it away.</div>
      <div class="lede">Click the Chats icon while you’re already on it and the list slides out of view. Click again to bring it back.</div>
    </div>
    <div class="grain"></div>
  </div>`,

  popup: () => `<div class="stage">
    ${glows([[640, 300, 760, MINT], [-200, -180, 560, SAGE], [1000, 560, 380, PEACH]])}
    <div style="position:absolute;left:76px;top:0;bottom:0;width:430px;display:flex;flex-direction:column;justify-content:center;gap:26px">
      <div class="label">Settings</div>
      <div class="display" style="font-size:66px">Make it <em>yours.</em></div>
      <div class="lede">Click the keys in the popup and press a new combination. Turn on <b style="color:var(--ink);font-weight:600">Ignore while typing</b> if you use Ctrl&nbsp;+&nbsp;B for bold.</div>
      <div class="lede" style="font-size:16px">Light and dark themes follow your system.</div>
    </div>
    <div class="shot" style="left:580px;top:170px;width:600px"><img src="${SHOTS}popup-10x-light.png"></div>
    <div class="shot" style="left:640px;top:430px;width:600px"><img src="${SHOTS}popup-10x-dark-ctrl-shift-k.png"></div>
    <div class="grain"></div>
  </div>`,

  private: () => `<div class="stage">
    ${glows([[400, 320, 620, MINT], [-200, -200, 520, SAGE], [1000, -100, 400, PEACH]])}
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center">
      <img src="${ICON}" width="96" height="96" style="border-radius:24px;box-shadow:0 20px 40px -10px rgba(16,37,29,.35)">
      <div class="display" style="font-size:72px">Quiet by <em>design.</em></div>
      <div style="display:grid;grid-template-columns:repeat(3,260px);gap:0;margin-top:18px;border-top:1px solid var(--hair)">
        ${[["No tracking", "Nothing is collected or sent anywhere."], ["One site only", "Runs on web.whatsapp.com and nowhere else."], ["Open source", "Read every line on GitHub."]]
          .map(([t, d], i) => `<div style="padding:26px 26px 0;${i ? "border-left:1px solid var(--hair);" : ""}text-align:left"><div class="serif" style="font-size:30px">${t}</div><div class="lede" style="font-size:16px;margin-top:6px">${d}</div></div>`).join("")}
      </div>
    </div>
    <div class="grain"></div>
  </div>`,

  tile: () => `<div class="stage">
    ${glows([[180, 80, 360, MINT], [-120, -140, 300, SAGE]])}
    <div style="position:absolute;inset:0;padding:30px 32px;display:flex;flex-direction:column;justify-content:space-between">
      ${brand}
      <div class="display" style="font-size:40px">Give your chats <em>room to breathe.</em></div>
      <div style="transform:scale(.72);transform-origin:left bottom">${keys(["Ctrl", "B"])}</div>
    </div>
    <div class="grain"></div>
  </div>`,

  marquee: () => `<div class="stage">
    ${glows([[880, 160, 700, MINT], [-200, -260, 560, SAGE], [420, 360, 380, PEACH]])}
    <div style="position:absolute;left:88px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;gap:26px">
      ${brand}
      <div class="display" style="font-size:74px">Give your chats <em>room to breathe.</em></div>
      ${keys(["Ctrl", "B"])}
    </div>
    ${win({ x: 690, y: 64, w: 640, h: 560, off: true })}
    <div class="grain"></div>
  </div>`,
};

const name = location.hash.slice(1) || "hero";
document.getElementById("root").innerHTML = scenes[name]();
</script>
</body>
</html>
